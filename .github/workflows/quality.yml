name: quality

on:
  pull_request:
  push:
    branches:
      - develop
      - main
  schedule:
    # Monday 09:00 Asia/Seoul (GitHub Actions cron uses UTC).
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify production build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Run tests, content gates, audit, and build
        run: npm run verify
